<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#eaf2fc;
    --deep:#dce9f9;
    --mid:#8fb4dd;
    --sky:#5b8fc7;
    --mist:#3a6494;
    --pale:#e3eefa;
    --paper:#0a1f3d;
    --line:rgba(174,203,232,.16);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(130% 90% at 50% -10%, #1a3a64 0%, #0d2546 42%, #061528 100%) fixed;
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px;margin:0 auto;padding:0 24px}

  header{padding:34px 0 0;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:11px;font-family:'Fraunces',serif;font-weight:600;font-size:18px;letter-spacing:-.01em}
  .mark{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 32% 30%,var(--sky),var(--deep));box-shadow:0 4px 14px rgba(19,49,92,.28)}
  .today{font-size:13px;color:var(--mid);font-variant-numeric:tabular-nums}

  .hero{padding:74px 0 40px}
  .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.22em;color:var(--sky);font-weight:600;margin-bottom:22px}
  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:clamp(40px,8vw,68px);
    line-height:1.02;
    letter-spacing:-.025em;
    color:var(--deep);
  }
  h1 em{font-style:italic;color:var(--mid)}

  .composer{
    margin-top:38px;
    background:rgba(20,46,82,.5);
    backdrop-filter:blur(10px);
    border:1px solid var(--line);
    border-radius:22px;
    padding:8px;
    box-shadow:0 24px 60px -28px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.05);
  }
  textarea{
    width:100%;
    border:0;
    background:transparent;
    resize:none;
    font-family:'Inter',sans-serif;
    font-size:18px;
    line-height:1.5;
    color:var(--ink);
    padding:20px 20px 8px;
    min-height:96px;
    outline:none;
  }
  textarea::placeholder{color:var(--sky);opacity:.7}
  .composer-bar{display:flex;align-items:center;justify-content:space-between;padding:6px 12px 8px}
  .clock{font-size:13px;color:var(--mid);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:7px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--sky);box-shadow:0 0 0 4px rgba(91,143,199,.18)}
  .cta{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    color:#fff;
    background:linear-gradient(135deg,var(--mid),var(--deep));
    border:0;
    padding:13px 26px;
    border-radius:14px;
    cursor:pointer;
    transition:transform .15s ease,box-shadow .2s ease,opacity .2s;
    box-shadow:0 10px 22px -8px rgba(19,49,92,.55);
  }
  .cta:hover{transform:translateY(-1px);box-shadow:0 14px 28px -8px rgba(19,49,92,.6)}
  .cta:active{transform:translateY(0)}
  .cta:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}
  :focus-visible{outline:2.5px solid var(--sky);outline-offset:3px}

  .timeline{padding:14px 0 90px}
  .timeline-head{display:flex;align-items:baseline;justify-content:space-between;margin:30px 0 10px}
  .timeline-head h2{font-family:'Fraunces',serif;font-weight:500;font-size:22px;color:var(--deep)}
  .count{font-size:13px;color:var(--mid)}

  .empty{
    color:var(--sky);
    font-size:15px;
    padding:34px 4px;
    border-top:1px solid var(--line);
  }

  .feed{list-style:none;position:relative;margin-top:6px}
  .feed::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--mist),transparent)}
  .entry{position:relative;padding:16px 0 16px 34px;border-bottom:1px solid var(--line);animation:rise .4s ease both}
  .entry::before{content:"";position:absolute;left:1px;top:22px;width:14px;height:14px;border-radius:50%;background:#0d2546;border:3px solid var(--sky);box-shadow:0 2px 10px rgba(91,143,199,.5)}
  .entry .stamp{font-size:12px;color:var(--mid);font-variant-numeric:tabular-nums;letter-spacing:.02em;margin-bottom:5px}
  .entry .text{font-size:16px;line-height:1.5;color:var(--ink);white-space:pre-wrap;word-break:break-word}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  @media (max-width:520px){
    .hero{padding:54px 0 30px}
    .cta{padding:12px 20px}
    .composer-bar{flex-wrap:wrap;gap:10px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand"><span class="mark"></span>Food Diary</div>
      <div class="today" id="today"></div>
    </header>

    <section class="hero">
      <div class="eyebrow">Today's log</div>
      <h1>What did you<br><em>eat today?</em></h1>

      <div class="composer">
        <textarea id="entry" placeholder="A bowl of ramen, two clementines, too much coffee…" aria-label="Food entry"></textarea>
        <div class="composer-bar">
          <span class="clock"><span class="dot"></span><span id="clock"></span></span>
          <button class="cta" id="save" disabled>Save entry</button>
        </div>
      </div>
    </section>

    <section class="timeline">
      <div class="timeline-head">
        <h2>Your day</h2>
        <span class="count" id="count">No entries yet</span>
      </div>
      <p class="empty" id="empty">Your first bite of the day will appear here, stamped with the time.</p>
      <ul class="feed" id="feed"></ul>
    </section>
  </div>

<script>
  const $ = s => document.querySelector(s);
  const entryEl = $('#entry'), saveBtn = $('#save'), feed = $('#feed'),
        empty = $('#empty'), count = $('#count'), clock = $('#clock');
  let entries = [];

  $('#today').textContent = new Date().toLocaleDateString(undefined,
    {weekday:'long', month:'long', day:'numeric'});

  const fmtTime = d => d.toLocaleTimeString(undefined,
    {hour:'numeric', minute:'2-digit'});
  const fmtDate = d => d.toLocaleDateString(undefined,
    {weekday:'short', month:'short', day:'numeric'});

  function tick(){ clock.textContent = fmtTime(new Date()); }
  tick(); setInterval(tick, 1000);

  entryEl.addEventListener('input', () => {
    saveBtn.disabled = entryEl.value.trim() === '';
  });
  entryEl.addEventListener('keydown', e => {
    if((e.metaKey||e.ctrlKey) && e.key==='Enter') save();
  });
  saveBtn.addEventListener('click', save);

  function save(){
    const text = entryEl.value.trim();
    if(!text) return;
    entries.unshift({ text, time: new Date() });   // time saved automatically
    entryEl.value = '';
    saveBtn.disabled = true;
    entryEl.focus();
    render();
  }

  function render(){
    empty.style.display = entries.length ? 'none' : 'block';
    count.textContent = entries.length
      ? entries.length + (entries.length===1?' entry':' entries')
      : 'No entries yet';
    feed.innerHTML = entries.map(e => `
      <li class="entry">
        <div class="stamp">${fmtDate(e.time)} · ${fmtTime(e.time)}</div>
        <div class="text"></div>
      </li>`).join('');
    feed.querySelectorAll('.text').forEach((el,i)=> el.textContent = entries[i].text);
  }
</script>
</body>
</html>
